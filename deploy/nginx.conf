# Included by nginx.conf in the http context.
map $http_accept $island_webp_suffix {
    default ".no-webp";
    "~*image/webp" ".webp";
}
map $http_accept $island_avif_suffix {
    default ".no-avif";
    "~*image/avif" ".avif";
}
server {
    listen 80 default_server;
    server_name 43.135.170.243;
    root /var/www/daily-island/static;
    client_max_body_size 10m;
    sendfile on;
    etag on;
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml font/ttf application/octet-stream model/gltf-binary;

    # Public artwork only. Uploaded private photos stay behind the application.
    location ~* ^/art/.+\.(png|jpe?g)$ {
        try_files $uri$island_avif_suffix $uri$island_webp_suffix $uri =404;
        expires 7d;
        add_header Vary Accept always;
        add_header X-Content-Type-Options nosniff always;
    }
    location /_next/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~ ^/(art|fonts|models)/ {
        try_files $uri =404;
        expires 7d;
    }
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header oai-authenticated-user-id "";
        proxy_set_header oai-authenticated-user-email "";
        proxy_read_timeout 60s;
    }
}
