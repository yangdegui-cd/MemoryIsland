# Included by nginx.conf in the http context.
map $http_accept $island_webp_suffix {
    default ".no-webp";
    "~*image/webp" ".webp";
}
map $http_accept $island_avif_suffix {
    default ".no-avif";
    "~*image/avif" ".avif";
}
server {
    listen 80 default_server;
    server_name island.ydgui.com 43.135.170.243;

    # Keep HTTP-01 reachable for unattended certificate renewals.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 308 https://island.ydgui.com$request_uri;
    }
}
server {
    listen 443 ssl http2;
    server_name island.ydgui.com;
    ssl_certificate /etc/letsencrypt/live/island.ydgui.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/island.ydgui.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:IslandSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Preserve the separately deployed anonymous wheel when present.
    include /etc/nginx/snippets/topic-wheel*.conf;
    root /var/www/daily-island/static;
    client_max_body_size 10m;
    sendfile on;
    etag on;
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml font/ttf application/octet-stream model/gltf-binary;

    # Public artwork only. Uploaded private photos stay behind the application.
    location ^~ /api/media/ {
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8792;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location ^~ /media-stream/ {
        proxy_pass http://127.0.0.1:8792;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 120s;
        # Playback links are bearer links; avoid storing them in access logs.
        access_log off;
    }

    location ~* ^/art/.+\.(png|jpe?g)$ {
        try_files $uri$island_avif_suffix $uri$island_webp_suffix $uri =404;
        expires 7d;
        add_header Vary Accept always;
        add_header X-Content-Type-Options nosniff always;
    }
    location /_next/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~ ^/(art|fonts|models|music)/ {
        try_files $uri =404;
        expires 7d;
    }
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Miniflare uses this URL for origin checks and Secure session cookies.
        # Always overwrite client input; the upstream listens on loopback only.
        proxy_set_header MF-Original-URL $scheme://$host$request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header oai-authenticated-user-id "";
        proxy_set_header oai-authenticated-user-email "";
        proxy_read_timeout 60s;
    }
}
